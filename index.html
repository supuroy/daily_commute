<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1720">
<title>Bus Commute</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Commute">
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #111827; --muted: #5b6573; --line: #e2e6ea;
    --accent: #0b6bcb; --best: #0a8f4e; --best-bg: #e7f6ee; --warn: #b45309; --warn-bg: #fff4e0;
    --err: #b42318; --err-bg: #fdecea; --live: #0a8f4e; --sched: #8a6a00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720; --card: #18222e; --text: #f1f5f9; --muted: #9aa7b6; --line: #2a3745;
      --accent: #5aa9ff; --best: #3ddc84; --best-bg: #123222; --warn: #fbbf24; --warn-bg: #3a2c0b;
      --err: #ff8a80; --err-bg: #3b1613; --live: #3ddc84; --sched: #e0b84c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; }
  h1 { font-size: 1.3rem; margin: 0; }
  #updated { color: var(--muted); font-size: .85rem; text-align: right; }
  button.refresh {
    background: none; border: 1px solid var(--line); color: var(--text); border-radius: 10px;
    padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; margin-left: 8px;
  }
  .banner { border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: .95rem; }
  .banner.err { background: var(--err-bg); color: var(--err); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 18px;
    padding: 16px; margin-bottom: 12px;
  }
  .card.best { border-color: var(--best); background: var(--best-bg); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .route {
    background: var(--accent); color: #fff; font-weight: 800; font-size: 1.25rem;
    padding: 2px 12px; border-radius: 10px; min-width: 48px; text-align: center;
  }
  .route.r-24, .route.r-33 { background: #f4a300; color: #1a1a1a; }
  .route.r-D { background: #b5123e; color: #fff; }
  .route.r-545 { background: #1f2f86; color: #fff; }
  .route.r-Shuttle { background: #0f766e; color: #fff; font-size: 1rem; }
  .route.sm { font-size: .95rem; padding: 1px 8px; min-width: 0; vertical-align: 1px; }
  .head { color: var(--muted); font-size: .9rem; flex: 1; min-width: 0; }
  .badge-best { background: var(--best); color: #fff; font-size: .75rem; font-weight: 700; padding: 3px 8px; border-radius: 8px; }
  .big { font-size: 2.1rem; font-weight: 800; line-height: 1.1; margin-bottom: 10px; }
  .big small { font-size: 1rem; font-weight: 500; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row .k { color: var(--muted); font-size: .95rem; }
  .row .v { font-weight: 700; font-size: 1.15rem; text-align: right; }
  .tag { font-size: .65rem; font-weight: 800; letter-spacing: .04em; padding: 2px 6px; border-radius: 6px; border: 1px solid currentColor; vertical-align: middle; margin-left: 6px; }
  .tag.live { color: var(--live); } .tag.sched { color: var(--sched); } .tag.est { color: var(--muted); }
  nav.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
  nav.tabs button {
    flex: 1; padding: 10px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--card);
    color: var(--muted); font: inherit; font-weight: 700; cursor: pointer;
  }
  nav.tabs button.on { border-color: var(--accent); color: var(--text); }
  button.track {
    margin: 10px 8px 0 0; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--accent);
    background: none; color: var(--accent); font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer;
  }
  button.track.stop { border-color: var(--muted); color: var(--muted); }
  .card.alert { border-color: var(--warn); background: var(--warn-bg); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .75; } }
  .empty { text-align: center; color: var(--muted); padding: 32px 8px; }
  footer { color: var(--muted); font-size: .78rem; margin-top: 16px; line-height: 1.5; }
  footer a { color: var(--accent); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Bus Commute</h1>
    <div><span id="updated">Loading…</span><button class="refresh" id="refreshBtn" type="button">Refresh</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="home">To 545 (evening)</button>
    <button type="button" data-tab="office">To office (morning)</button>
  </nav>
  <div id="banners"></div>
  <div id="cards"></div>
  <footer id="foot"></footer>
</main>

<script>
// ===== Edit these =====
const API_KEY = "TEST";                       // swap in your real OneBusAway key
const ORIGIN_STOP = "1_14070";                // Elliott Ave W & W Prospect St (NW-bound pole; auto-corrected to downtown-bound)
const ORIGIN_ROUTES = ["24", "33", "D Line"]; // matched tolerantly ("D", "D Line", "RapidRide D Line")
const TRANSFER_STOP_NAME = "3rd Ave & Pike St";
const WESTLAKE_STOP = "1_700";                // 4th Ave & Pike St
const WESTLAKE_ROUTE = "545";
const WALK_MINUTES = 3;
const REFRESH_SECONDS = 30;
const TOP_N = 3;                              // show only the best N options (ranked by which 545 you catch)
const LOOKAHEAD_MINUTES = 45;                 // how far ahead to consider buses and shuttles when ranking
// EG shuttle, campus -> Westlake (1620 4th Ave), Mon-Fri, walk-on. [depart campus, arrive Westlake], 24h Seattle time.
// Source: "2026 Shuttle Schedules_Downtown" (effective Jun 23, 2025). Confirm in TripShot if it changes.
const SHUTTLE_ENABLED = true;
const SHUTTLE_TO_WESTLAKE = [
  ["14:00", "14:15"], ["14:45", "15:05"], ["15:00", "15:20"], ["15:20", "15:40"], ["15:40", "16:00"], ["15:50", "16:10"],
  ["15:55", "16:15"], ["16:10", "16:30"], ["16:25", "16:45"], ["16:35", "16:55"], ["16:45", "17:05"], ["16:55", "17:15"],
  ["17:10", "17:30"], ["17:20", "17:40"], ["17:45", "18:05"], ["17:55", "18:15"], ["18:10", "18:30"], ["18:30", "18:50"],
];
const SHUTTLE_ACCESS_MINUTES = 5;   // time you need to reach the campus shuttle stop (hides shuttles you can't make)
const SHUTTLE_WALK_MINUTES = 3;     // walk from the Westlake shuttle stop to the 545 stop
const SHUTTLE_MAX = 4;              // how many upcoming shuttles to consider
const MAX_TRIPS = 8;                         // how many upcoming buses to consider
// --- "To office" tab: you've just stepped off the 545 at 5th Ave & Pine (1_760) and want the fastest way to work ---
const OFFICE_STOP = "1_14070";                // Elliott Ave W & W Prospect St, northbound pole (where the bus drops you)
const OFFICE_BOARD_24_33 = ["1_590", "3rd Ave & Pine St"];  // northbound 24 / 33
const OFFICE_BOARD_D = ["1_575", "3rd Ave & Pike St"];      // northbound D Line
const BEAR_CREEK_STOP = "1_81755";            // where you board the 545 in the morning (first stop of the inbound trip)
const USUAL_545_DEPARTURE = "05:56";          // the Bear Creek departure you aim for (24h Seattle time); only used to label it
const DROPOFF_545 =["1_760", "5th Ave & Pine St"];   // where the 545 drops you downtown
const WALK_545_TO_3RD_MIN = 2;               // walk from the 545 drop-off to the 3rd Ave stops
const WALK_545_TO_SHUTTLE_MIN = 0;            // walk from the 545 drop-off to the Westlake shuttle stop (1620 4th Ave)
const BUS_TO_OFFICE_WALK_MIN = 6;             // walk from the Elliott/Prospect stop to your desk (guess: edit me)
const SHUTTLE_TO_OFFICE_WALK_MIN = 2;         // walk from the campus shuttle drop-off to your desk (guess: edit me)
// EG shuttle, Westlake -> campus, Mon-Fri. [depart Westlake, arrive campus], 24h Seattle time (same PDF as above).
const SHUTTLE_TO_CAMPUS = [
  ["06:30", "06:50"], ["06:45", "07:08"], ["07:00", "07:20"], ["07:10", "07:30"], ["07:20", "07:40"], ["07:40", "08:04"],
  ["07:50", "08:08"], ["08:00", "08:20"], ["08:10", "08:30"], ["08:30", "08:54"], ["08:40", "09:00"], ["08:55", "09:15"],
  ["09:05", "09:25"], ["09:25", "09:45"], ["09:35", "09:59"], ["09:50", "10:10"], ["10:00", "10:20"],
];
const NEARBY_RADIUS_M = 150;                 // search radius for the opposite-direction pole
// ======================

const BASE = "https://api.pugetsound.onebusaway.org/api/where/";
const DOWNTOWN_RE = /downtown|pioneer|stadium|sodo|king street|\bseattle\b/i;
const OPPOSITE = { N: "S", S: "N", E: "W", W: "E", NE: "SW", SW: "NE", NW: "SE", SE: "NW" };

// A key passed as ?key=XXXX is saved in this browser only, so it never has to be committed to a public repo.
const KEY = (() => {
  try {
    const q = new URLSearchParams(location.search).get("key");
    if (q) { localStorage.setItem("obaKey", q); history.replaceState(null, "", location.pathname); }
    return localStorage.getItem("obaKey") || API_KEY;
  } catch { return API_KEY; }
})();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const normRoute = (s) => String(s || "").toUpperCase().replace(/RAPIDRIDE/g, "").replace(/\bLINE\b/g, "").replace(/\s+/g, "").trim();
const WANTED = new Set(ORIGIN_ROUTES.map(normRoute));
const routeOk = (a) => WANTED.has(normRoute(a.routeShortName));
const normName = (s) => String(s || "").toLowerCase().replace(/\bavenue\b/g, "ave").replace(/\bstreet\b/g, "st")
  .replace(/[^a-z0-9& ]/g, " ").replace(/\s+/g, " ").trim();
const TARGET_NAME = normName(TRANSFER_STOP_NAME);

class RateLimitError extends Error {}

async function api(path, params = {}) {
  const url = new URL(BASE + path + ".json");
  url.searchParams.set("key", KEY);
  for (const [k, v] of Object.entries(params)) url.searchParams.set(k, v);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 15000);
  try {
    const f = window.__mockFetch || fetch;
    const res = await f(url.toString(), { signal: ctl.signal });
    if (res.status === 429) throw new RateLimitError("Rate limited");
    let body = null;
    try { body = await res.json(); } catch { /* handled below */ }
    if (body && body.code === 429) throw new RateLimitError("Rate limited");
    if (body && body.currentTime) skew = body.currentTime - Date.now();
    if (!res.ok || !body || body.code !== 200) {
      throw new Error(`API error ${res.status}${body && body.text ? ": " + body.text : ""}`);
    }
    return body;
  } finally { clearTimeout(timer); }
}

// ---------- state ----------
let origin = null;          // { id, name, direction, confirmed }
let transferStopId = null;
const rideSecs = new Map(); // tripId -> seconds from origin to 3rd & Pike
let model = null;           // last good result ("To 545" tab)
let officeModel = null;     // last good result ("To office" tab)
let tab = "home";           // "home" | "office"
let track = null;           // the trip you're riding: { tripId, serviceDate, destId, destName, route, headsign, board, boardLive }
let trackModel = null, trackAlerted = false, wakeLock = null;
let pick = null;            // confirming which 545 departure from Bear Creek you're on: { cands, i }
let busy = false, timer = null, backoff = 0, lastError = null, emptyStreak = 0, seen = "";
let skew = 0;               // server clock minus device clock, so a wrong device clock can't hide buses
const nowMs = () => Date.now() + skew;

// ---------- origin resolution ----------
async function getArrivals(stopId, minutesAfter) {
  const r = await api(`arrivals-and-departures-for-stop/${stopId}`, { minutesBefore: 2, minutesAfter });
  return r.data.entry.arrivalsAndDepartures || [];
}

async function resolveOrigin(force) {
  const ck = "origin:" + ORIGIN_STOP;
  if (!force) {
    try { const c = JSON.parse(localStorage.getItem(ck)); if (c) { origin = c; return; } } catch {}
  }
  const s = (await api(`stop/${ORIGIN_STOP}`)).data.entry;
  console.log(`[origin] configured ${s.id} "${s.name}" dir=${s.direction} @ ${s.lat},${s.lon}`);
  const near = (await api("stops-for-location", { lat: s.lat, lon: s.lon, radius: NEARBY_RADIUS_M })).data.list
    .filter((x) => x.id !== s.id)
    .map((x) => ({ ...x, d: Math.hypot((x.lat - s.lat) * 111000, (x.lon - s.lon) * 76000) }))
    .sort((a, b) => a.d - b.d);
  const opp = OPPOSITE[s.direction];
  const ordered = [...near.filter((x) => x.direction === opp), ...near.filter((x) => x.direction !== opp), s].slice(0, 5);
  console.log("[origin] candidates:", ordered.map((c) => `${c.id} (${c.direction}) "${c.name}"`));
  for (const c of ordered) {
    const matching = (await getArrivals(c.id, 60)).filter(routeOk);
    const downtown = matching.filter((a) => DOWNTOWN_RE.test(a.tripHeadsign));
    console.log(`[origin] ${c.id} "${c.name}" (${c.direction}): ${matching.length} matching arrivals, ${downtown.length} downtown; headsigns =`,
      [...new Set(matching.map((a) => a.tripHeadsign))]);
    if (downtown.length) {
      origin = { id: c.id, name: c.name, direction: c.direction, confirmed: true };
      localStorage.setItem(ck, JSON.stringify(origin));
      console.log(`[origin] USING ${origin.id} (configured: ${s.id})`);
      return;
    }
  }
  const guess = near.find((x) => x.direction === opp);
  if (!guess) throw new Error("Couldn't find a downtown-bound stop with arrivals for these routes. Try again later.");
  origin = { id: guess.id, name: guess.name, direction: guess.direction, confirmed: false };
  console.warn(`[origin] no downtown arrivals right now; provisionally using opposite-direction stop ${guess.id}`);
}

// ---------- ride time ----------
function findTransfer(td, originId) {
  const stops = new Map((td.data.references.stops || []).map((x) => [x.id, x.name]));
  const times = td.data.entry.schedule.stopTimes || [];
  const o = times.findIndex((t) => t.stopId === originId);
  if (o < 0) return null;
  const hit = (t) => {
    const n = normName(stops.get(t.stopId));
    return n === TARGET_NAME || (n.includes("3rd") && n.includes("pike"));
  };
  const idx = times.findIndex((t, i) => i > o && (t.stopId === transferStopId || hit(t)));
  if (idx < 0) return null;
  transferStopId = times[idx].stopId;
  return times[idx].arrivalTime - times[o].arrivalTime;
}

async function rideFor(a) {
  if (rideSecs.has(a.tripId)) return rideSecs.get(a.tripId);
  const td = await api(`trip-details/${encodeURIComponent(a.tripId)}`, { serviceDate: a.serviceDate });
  const secs = findTransfer(td, origin.id);
  if (secs == null) return null;
  rideSecs.set(a.tripId, secs);
  return secs;
}

// Scheduled minutes from the Westlake stop to the 545 trip's final stop (cached per trip).
const endSecs = new Map();
async function endFor(a) {
  if (endSecs.has(a.tripId)) return endSecs.get(a.tripId);
  const td = await api(`trip-details/${encodeURIComponent(a.tripId)}`, { serviceDate: a.serviceDate });
  const times = td.data.entry.schedule.stopTimes || [];
  const from = times.find((t) => t.stopId === WESTLAKE_STOP);
  const last = times[times.length - 1];
  if (!from || !last) return null;
  const name = ((td.data.references.stops || []).find((s) => s.id === last.stopId) || {}).name || "last stop";
  const res = { secs: last.arrivalTime - (from.departureTime ?? from.arrivalTime), name, stopId: last.stopId };
  endSecs.set(a.tripId, res);
  return res;
}

// Upcoming shuttle runs as epoch ms, using Seattle wall-clock time (works whatever the device time zone is).
function seattleClock(now) {
  const mockAt = location.search.match(/[?&]at=(\d\d):(\d\d)/);   // ?mock&at=16:20 pretends it's 4:20 PM on a weekday
  if (mockAt) return { dow: "Wed", sec: (+mockAt[1] * 60 + +mockAt[2]) * 60 };
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US", { timeZone: "America/Los_Angeles", weekday: "short", hour: "numeric", minute: "numeric", second: "numeric", hourCycle: "h23" })
    .formatToParts(new Date(now)).map((x) => [x.type, x.value]));
  return { dow: p.weekday, sec: +p.hour * 3600 + +p.minute * 60 + +p.second };
}

function shuttleRuns(now, table = SHUTTLE_TO_WESTLAKE, accessMin = SHUTTLE_ACCESS_MINUTES) {
  if (!SHUTTLE_ENABLED) return [];
  const { dow, sec } = seattleClock(now);
  if (dow === "Sat" || dow === "Sun") return [];
  const toSec = (s) => +s.slice(0, 2) * 3600 + +s.slice(3) * 60;
  return table
    .map(([d, a]) => ({ dep: now + (toSec(d) - sec) * 1000, arr: now + (toSec(a) - sec) * 1000 }))
    .filter((r) => r.dep >= now + accessMin * 60000 && r.dep <= now + LOOKAHEAD_MINUTES * 60000)
    .slice(0, SHUTTLE_MAX);
}

// ---------- "I'm on this bus" tracker ----------
function trackBtns(o, i) {
  if (!o.tripId || !o.destId) return "";
  return `<button class="track" type="button" data-track="bus" data-i="${i}">I'm on this bus</button>`;
}

async function wake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { /* not supported or denied: tracking still works while the screen is on */ }
}

function startTrack(t) {
  track = t; trackModel = null; trackAlerted = false; backoff = 0; lastError = null;
  try { localStorage.setItem("track", JSON.stringify(t)); } catch {}
  wake(true);
  clearTimeout(timer);
  render();
  refresh(true);
}

function stopTrack() {
  track = null; trackModel = null;
  try { localStorage.removeItem("track"); } catch {}
  wake(false);
  clearTimeout(timer);
  render();
  refresh(true);
}

// Upcoming 545s from Westlake (4th & Pike), soonest first, with live times where available.
async function load545s() {
  const wl = (await getArrivals(WESTLAKE_STOP, 120)).filter((a) => normRoute(a.routeShortName) === WESTLAKE_ROUTE);
  const toRedmond = wl.filter((a) => /redmond/i.test(a.tripHeadsign));
  return (toRedmond.length ? toRedmond : wl)
    .map((a) => ({ a, ...live(a, "predictedDepartureTime", "scheduledDepartureTime") }))
    .map((x) => (x.t > 0 ? x : { ...x, ...live(x.a, "predictedArrivalTime", "scheduledArrivalTime") }))
    .sort((x, y) => x.t - y.t);
}

async function loadTrack() {
  const td = await api(`trip-details/${encodeURIComponent(track.tripId)}`, { serviceDate: track.serviceDate });
  const e = td.data.entry, st = e.schedule.stopTimes || [];
  const names = new Map((td.data.references.stops || []).map((s) => [s.id, s.name]));
  const di = st.findIndex((t) => t.stopId === track.destId);
  if (di < 0) throw new Error("Your stop isn't on this trip.");
  const s = e.status || {};
  const live = !!s.predicted && Number.isFinite(s.scheduleDeviation);
  const dev = live ? s.scheduleDeviation : 0;
  const now = nowMs();
  let ni = st.findIndex((t) => t.stopId === s.nextStop);
  if (ni < 0) {   // no live next stop: fall back to the schedule
    const sec = (now - track.serviceDate) / 1000 - dev;
    ni = st.findIndex((t) => t.arrivalTime >= sec);
  }
  const passed = ni < 0 || ni > di;
  const left = passed ? 0 : di - ni + 1;           // stops to go, counting your own stop
  const eta = track.serviceDate + (st[di].arrivalTime + dev) * 1000;
  const prevModel = trackModel;
  trackModel = { at: Date.now(), live, eta, left, passed,
    nextName: ni >= 0 ? names.get(st[ni].stopId) : null, nextIn: live && Number.isFinite(s.nextStopTimeOffset) ? s.nextStopTimeOffset : null,
    destName: track.destName || names.get(track.destId) };
  // Evening first leg: keep the next 545 you can catch, based on this bus's live ETA plus the walk.
  if (track.leg === "home" && !passed) {
    try {
      const ready = eta + WALK_MINUTES * 60000;
      const b = (await load545s()).find((y) => y.t >= ready);
      if (b) {
        const end = await endFor(b.a).catch(() => null);
        trackModel.next545 = { t: b.t, live: b.live, wait: b.t - ready, end: end ? b.t + end.secs * 1000 : null, endName: end && end.name };
      } else trackModel.next545 = null;
      trackModel.has545 = true;
    } catch { if (prevModel) { trackModel.next545 = prevModel.next545; trackModel.has545 = prevModel.has545; } }   // keep the last answer if this fetch fails
  }
  if (passed && track.auto) setTimeout(stopTrack, 0);   // the 545 has passed your drop-off: back to the office options
  if (!passed && !trackAlerted && (left <= 2 || eta - now <= 2 * 60000)) {
    trackAlerted = true;
    try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
  }
}

function renderTrack(cards) {
  const t = track, m = trackModel, now = nowMs();
  const head = `<div class="top"><span class="route r-${esc(normRoute(t.route))}">${esc(t.route)}</span><span class="head">${esc(t.headsign)}</span><span class="badge-best">ON BOARD</span></div>`;
  const stopBtn = `<button class="track stop" type="button" data-stop="1">${m && m.passed ? "Done" : "I got off / stop tracking"}</button>`;
  let body;
  if (!m) body = `<div class="big">Locating your bus…</div>`;
  else if (m.passed) body = `<div class="big">Trip finished</div><div class="row"><span class="k">This bus has passed ${esc(m.destName)}.</span></div>`;
  else {
    const soon = m.left <= 2 || m.eta - now <= 2 * 60000;
    body = `<div class="big">${soon ? "Get ready: " : ""}${m.left} stop${m.left === 1 ? "" : "s"} to go <small>· ${mins(m.eta - now)}</small></div>
      <div class="row"><span class="k">Next stop</span><span class="v">${esc(m.nextName || "—")}${m.nextIn != null ? ` <small>${mins(m.nextIn * 1000)}</small>` : ""}</span></div>
      <div class="row"><span class="k">Get off at</span><span class="v">${esc(m.destName)}</span></div>
      <div class="row"><span class="k">Arrive</span><span class="v">${fmt(m.eta)}${tag(m.live)}</span></div>`;
    if (t.leg === "home" && m.has545) {
      body += m.next545
        ? `<div class="row"><span class="k">Next <span class="route r-545 sm">545</span> you can catch</span><span class="v">${fmt(m.next545.t)}${tag(m.next545.live)}</span></div>
           <div class="row"><span class="k">Wait at Westlake</span><span class="v">${mins(m.next545.wait)}</span></div>
           ${m.next545.end ? `<div class="row"><span class="k">Arrive ${esc(m.next545.endName.replace(/\s*(Park\s*(&|and)\s*Ride|P&R).*$/i, "") + " P&R")}</span><span class="v">${fmt(m.next545.end)}<span class="tag est">EST</span></span></div>` : ""}`
        : `<div class="row"><span class="k">Next 545 you can catch</span><span class="v">none found</span></div>`;
    }
  }
  const soon = m && !m.passed && (m.left <= 2 || m.eta - now <= 2 * 60000);
  cards.innerHTML = `<section class="card best${soon ? " alert" : ""}">${head}${body}
    <div class="row"><span class="k">Boarded (fixed)</span><span class="v">${fmt(t.board)}</span></div>
    ${stopBtn}</section>`;
}

// Morning 545: find the departure from Bear Creek that's closest to now, let the rider confirm or nudge it, then track it.
async function begin545() {
  try {
    const r = await api(`arrivals-and-departures-for-stop/${BEAR_CREEK_STOP}`, { minutesBefore: 20, minutesAfter: 40 });
    const now = nowMs();
    const c = (r.data.entry.arrivalsAndDepartures || []).filter((a) => normRoute(a.routeShortName) === WESTLAKE_ROUTE)
      .map((a) => ({ a, ...live(a, "predictedDepartureTime", "scheduledDepartureTime") }))
      .map((x) => (x.t > 0 ? x : { ...x, ...live(x.a, "predictedArrivalTime", "scheduledArrivalTime") }))
      .sort((x, y) => x.t - y.t);
    if (!c.length) throw new Error("No 545 departures found at Bear Creek P&R around now.");
    // Default to the next departure (or one that left in the last 2 minutes); "Earlier"/"Later" nudge from there.
    let i = c.findIndex((x) => x.t >= now - 2 * 60000);
    if (i < 0) i = c.length - 1;
    pick = { cands: c, i };
    lastError = null;
  } catch (e) {
    lastError = e instanceof RateLimitError ? new Error("Rate limited. Try again in a moment.") : e;
  }
  render();
}

const seattleHM = (ms) => new Intl.DateTimeFormat("en-GB", { timeZone: "America/Los_Angeles", hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).format(new Date(ms));

function renderPick(cards) {
  const x = pick.cands[pick.i];
  cards.innerHTML = `<section class="card best">
    <div class="top"><span class="route r-545">545</span><span class="head">${esc(x.a.tripHeadsign)}</span></div>
    <div class="big">${x.t > nowMs() ? "Leaves" : "Left"} Bear Creek P&amp;R ${fmt(x.t)}${tag(x.live)}</div>
    ${seattleHM(x.a.scheduledDepartureTime || x.t) === USUAL_545_DEPARTURE ? `<div class="row"><span class="k">Your usual ${USUAL_545_DEPARTURE.replace(/^0/, "")} AM bus</span></div>` : ""}
    <div class="row"><span class="k">Is this the bus you're on?</span></div>
    <button class="track" type="button" data-pick="yes">Yes, track it</button>
    <button class="track stop" type="button" data-pick="prev"${pick.i === 0 ? " disabled" : ""}>◀ Earlier</button>
    <button class="track stop" type="button" data-pick="next"${pick.i === pick.cands.length - 1 ? " disabled" : ""}>Later ▶</button>
    <button class="track stop" type="button" data-pick="cancel">Cancel</button></section>`;
}

$("cards").addEventListener("click", (ev) => {
  if (ev.target.closest("button[data-ride545]")) { begin545(); return; }
  const pk = ev.target.closest("button[data-pick]");
  if (pk && pick) {
    const d = pk.dataset.pick;
    if (d === "prev") pick.i = Math.max(0, pick.i - 1);
    else if (d === "next") pick.i = Math.min(pick.cands.length - 1, pick.i + 1);
    else if (d === "cancel") pick = null;
    else if (d === "yes") {
      const x = pick.cands[pick.i];
      pick = null;
      startTrack({ tripId: x.a.tripId, serviceDate: x.a.serviceDate, destId: DROPOFF_545[0], destName: DROPOFF_545[1], route: "545",
        headsign: x.a.tripHeadsign, board: x.t, boardLive: x.live, auto: true });
      return;
    }
    render();
    return;
  }
  if (ev.target.closest("button[data-stop]")) { stopTrack(); return; }
  const b = ev.target.closest("button[data-track]");
  if (!b) return;
  const o = (tab === "office" ? officeModel : model).options[+b.dataset.i];
  if (!o) return;
  startTrack({ tripId: o.tripId, serviceDate: o.serviceDate, destId: o.destId, destName: o.destName, route: o.route,
    headsign: o.headsign, board: o.board, boardLive: o.boardLive, leg: tab });
});

// ---------- "To office" tab ----------
const officeRide = new Map();   // "tripId|fromStop" -> seconds on the bus
async function rideBetween(a, fromStop, toStop) {
  const k = a.tripId + "|" + fromStop;
  if (officeRide.has(k)) return officeRide.get(k);
  const td = await api(`trip-details/${encodeURIComponent(a.tripId)}`, { serviceDate: a.serviceDate });
  const st = td.data.entry.schedule.stopTimes || [];
  const i = st.findIndex((t) => t.stopId === fromStop);
  const j = st.findIndex((t, n) => n > i && t.stopId === toStop);
  if (i < 0 || j < 0) return null;
  const secs = st[j].arrivalTime - st[i].arrivalTime;
  officeRide.set(k, secs);
  return secs;
}

async function loadOffice() {
  const boards = [OFFICE_BOARD_24_33, OFFICE_BOARD_D];
  const lists = await Promise.all(boards.map(([id]) => getArrivals(id, LOOKAHEAD_MINUTES + WALK_545_TO_3RD_MIN + 2)));
  const now = nowMs();
  const cand = [];
  lists.forEach((l, i) => l.filter(routeOk).forEach((a) => {
    const t = live(a, "predictedArrivalTime", "scheduledArrivalTime");
    if (t.t >= now + WALK_545_TO_3RD_MIN * 60000 && t.t <= now + LOOKAHEAD_MINUTES * 60000) cand.push({ a, ...t, stopId: boards[i][0], stopName: boards[i][1] });
  }));
  cand.sort((x, y) => x.t - y.t);
  const top = cand.slice(0, MAX_TRIPS);
  const rides = await Promise.allSettled(top.map((x) => rideBetween(x.a, x.stopId, OFFICE_STOP)));
  const options = [];
  top.forEach((x, i) => {
    const secs = rides[i].status === "fulfilled" ? rides[i].value : null;
    if (secs == null) return;
    const arr = x.t + secs * 1000;
    options.push({ route: x.a.routeShortName, headsign: x.a.tripHeadsign, board: x.t, boardLive: x.live, boardAt: x.stopName,
      tripId: x.a.tripId, serviceDate: x.a.serviceDate, destId: OFFICE_STOP, destName: "Elliott Ave W & W Prospect St",
      arr, arrLabel: "Get off at Elliott &amp; Prospect", office: arr + BUS_TO_OFFICE_WALK_MIN * 60000 });
  });
  for (const r of shuttleRuns(now, SHUTTLE_TO_CAMPUS, WALK_545_TO_SHUTTLE_MIN)) {
    options.push({ route: "Shuttle", headsign: "EG shuttle: Westlake to campus", board: r.dep, boardLive: false, boardAt: "1620 4th Ave (Westlake)",
      arr: r.arr, arrLabel: "Arrive campus", sched: true, office: r.arr + SHUTTLE_TO_OFFICE_WALK_MIN * 60000 });
  }
  options.sort((p, q) => p.office - q.office || q.board - p.board);
  options.splice(TOP_N);
  if (options.length) options[0].best = true;
  officeModel = { options, at: Date.now(), none: !cand.length && !options.length };
}

// ---------- main refresh ----------
const live = (a, pred, sched) => (a.predicted && a[pred] > 0) ? { t: a[pred], live: true } : { t: a[sched], live: false };

async function refresh(manual) {
  if (busy) return;
  busy = true;
  $("refreshBtn").disabled = true;
  try {
    if (track) { await loadTrack(); lastError = null; backoff = 0; return; }
    if (tab === "office") { await loadOffice(); lastError = null; backoff = 0; return; }
    if (!origin) await resolveOrigin(false);
    const all = await getArrivals(origin.id, 60);
    const now = nowMs();
    const arr = all.filter(routeOk)
      .map((a) => ({ a, ...live(a, "predictedArrivalTime", "scheduledArrivalTime") }))
      .filter((x) => x.t >= now - 30000 && x.t <= now + LOOKAHEAD_MINUTES * 60000)
      .sort((x, y) => x.t - y.t).slice(0, MAX_TRIPS);
    seen = `${all.length} arrivals at ${origin.id}` + (all.length ? ` (${[...new Set(all.map((a) => a.routeShortName))].join(", ")})` : "");
    console.log("[refresh]", seen, "| matching:", arr.length);
    // Repeated empty results may mean the cached stop is wrong or stale: re-detect it next time.
    const anyMatch = all.some(routeOk);
    if (!anyMatch && ++emptyStreak >= 2) {
      origin = null; emptyStreak = 0;
      try { localStorage.removeItem("origin:" + ORIGIN_STOP); } catch {}
    } else if (anyMatch) emptyStreak = 0;

    const rides = await Promise.allSettled(arr.map((x) => rideFor(x.a)));

    const wl = (await getArrivals(WESTLAKE_STOP, 120)).filter((a) => normRoute(a.routeShortName) === WESTLAKE_ROUTE);
    const toRedmond = wl.filter((a) => /redmond/i.test(a.tripHeadsign));
    const buses545 = (toRedmond.length ? toRedmond : wl)
      .map((a) => ({ a, ...live(a, "predictedDepartureTime", "scheduledDepartureTime") }))
      .map((x) => (x.t > 0 ? x : { ...x, ...live(x.a, "predictedArrivalTime", "scheduledArrivalTime") }))
      .sort((x, y) => x.t - y.t);

    const options = arr.map((x, i) => {
      const r = rides[i];
      const ride = r.status === "fulfilled" ? r.value : null;
      const o = { route: x.a.routeShortName, headsign: x.a.tripHeadsign, board: x.t, boardLive: x.live, ride,
        tripId: x.a.tripId, serviceDate: x.a.serviceDate, destId: ride != null ? transferStopId : null, destName: TRANSFER_STOP_NAME };
      if (ride != null) {
        o.via = x.t + ride * 1000; o.viaLabel = "Arrive 3rd &amp; Pike";
        const ready = o.via + WALK_MINUTES * 60000;
        const b = buses545.find((y) => y.t >= ready);
        if (b) { o.bus = b.t; o.busLive = b.live; o.wait = b.t - ready; o.busA = b.a; }
      }
      return o;
    });
    for (const r of shuttleRuns(now)) {
      const o = { route: "Shuttle", headsign: "EG shuttle: campus to Westlake", board: r.dep, boardLive: false, ride: 0,
        via: r.arr, viaLabel: "Arrive Westlake", viaSched: true };
      const ready = r.arr + SHUTTLE_WALK_MINUTES * 60000;
      const b = buses545.find((y) => y.t >= ready);
      if (b) { o.bus = b.t; o.busLive = b.live; o.wait = b.t - ready; o.busA = b.a; }
      options.push(o);
    }
    // Rank: earliest 545 first; for the same 545, the option that lets you leave later; options with no 545 last.
    options.sort((p, q) => (p.bus ?? Infinity) - (q.bus ?? Infinity) || q.board - p.board);
    // One card per distinct 545 (the first, i.e. latest-leaving, option for it), so the list shows real choices.
    const seen545 = new Set();
    const picked = options.filter((o) => { const k = o.busA ? o.busA.tripId : null; if (k && seen545.has(k)) return false; if (k) seen545.add(k); return true; });
    options.splice(0, options.length, ...picked.slice(0, TOP_N));
    // Estimated arrival at the 545's last stop (Bear Creek P&R): live departure + scheduled run time.
    const uniq = [...new Map(options.filter((o) => o.busA).map((o) => [o.busA.tripId, o.busA])).values()];
    const ends = new Map();
    (await Promise.allSettled(uniq.map(async (a) => [a.tripId, await endFor(a)]))).forEach((r) => { if (r.status === "fulfilled" && r.value[1]) ends.set(...r.value); });
    options.forEach((o) => {
      const e = o.busA && ends.get(o.busA.tripId);
      if (e) { o.end = o.bus + e.secs * 1000; o.endName = e.name; o.endStopId = e.stopId; }
    });
    if (options.length && options[0].bus) options[0].best = true;

    model = { options, seen, at: Date.now(), noBuses: !options.length, no545: options.length && !buses545.length };
    lastError = null; backoff = 0;
  } catch (e) {
    console.error(e);
    lastError = e;
    backoff = e instanceof RateLimitError ? Math.min(backoff ? backoff * 2 : REFRESH_SECONDS * 2, 300) : 0;
  } finally {
    busy = false;
    $("refreshBtn").disabled = false;
    render();
    schedule();
  }
}

function schedule() {
  clearTimeout(timer);
  // While riding: every 60s, every 30s in the last 5 minutes.
  const trackEvery = trackModel && !trackModel.passed && trackModel.eta - nowMs() <= 5 * 60000 ? 30 : 60;
  timer = setTimeout(refresh, (backoff || (track ? trackEvery : REFRESH_SECONDS)) * 1000);
}

// ---------- rendering ----------
const fmt = (t) => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const mins = (ms) => { const m = Math.round(ms / 60000); return m <= 0 ? "Now" : m + " min"; };
const tag = (isLive) => `<span class="tag ${isLive ? "live" : "sched"}">${isLive ? "LIVE" : "SCHED"}</span>`;

function render() {
  const banners = [];
  if (KEY === "TEST") banners.push(`<div class="banner warn">Using the shared <b>TEST</b> key, which is heavily rate-limited. Add your real key (see README).</div>`);
  if (lastError instanceof RateLimitError) {
    banners.push(`<div class="banner err">Rate limited by the API. Retrying in ${backoff}s${model ? " (showing last good data)" : ""}.</div>`);
  } else if (lastError) {
    banners.push(`<div class="banner err">${esc(lastError.message === "Failed to fetch" ? "Network error: check your connection." : lastError.message)}${model ? " Showing last good data." : ""}</div>`);
  }
  if (tab === "home" && origin && !origin.confirmed) banners.push(`<div class="banner warn">No downtown arrivals right now, so the stop direction is unconfirmed.</div>`);
  $("banners").innerHTML = banners.join("");

  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  $("tabs").style.display = track ? "none" : "";
  const cards = $("cards");
  if (track) renderTrack(cards);
  else if (tab === "office") renderOffice(cards);
  else if (!model) { cards.innerHTML = lastError ? "" : `<div class="empty">Loading…</div>`; }
  else if (model.noBuses) cards.innerHTML = `<div class="empty">No upcoming 24 / 33 / D Line buses or EG shuttles in the next ${LOOKAHEAD_MINUTES} minutes.<br><small>${esc(model.seen)}. Retrying; the stop will be re-detected if this keeps happening.</small></div>`;
  else {
    const now = nowMs();
    cards.innerHTML = model.options.map((o, i) => {
      const rows = [];
      if (o.ride == null) rows.push(`<div class="row"><span class="k">Ride time</span><span class="v">unavailable</span></div>`);
      else {
        rows.push(`<div class="row"><span class="k">${o.viaLabel}</span><span class="v">${fmt(o.via)}${o.viaSched ? tag(false) : `<span class="tag est">EST</span>`}</span></div>`);
        rows.push(o.bus
          ? `<div class="row"><span class="k">Catch <span class="route r-545 sm">545</span> at</span><span class="v">${fmt(o.bus)}${tag(o.busLive)}</span></div>
             <div class="row"><span class="k">Wait at Westlake</span><span class="v">${mins(o.wait)}</span></div>
             ${o.end ? `<div class="row"><span class="k">Arrive ${esc(o.endName.replace(/\s*(Park\s*(&|and)\s*Ride|P&R).*$/i, "") + " P&R")}</span><span class="v">${fmt(o.end)}<span class="tag est">EST</span></span></div>` : ""}`
          : `<div class="row"><span class="k">Catch 545</span><span class="v">none found</span></div>`);
      }
      return `<section class="card${o.best ? " best" : ""}">
        <div class="top"><span class="route r-${esc(normRoute(o.route))}">${esc(o.route)}</span><span class="head">${esc(o.headsign)}</span>${o.best ? `<span class="badge-best">EARLIEST 545</span>` : ""}</div>
        <div class="big">${mins(o.board - now)} <small>· ${fmt(o.board)}${tag(o.boardLive)}</small></div>
        ${rows.join("")}
        ${trackBtns(o, i)}
      </section>`;
    }).join("") + (model.no545 ? `<div class="banner warn">No 545 departures found at Westlake in the next 2 hours.</div>` : "");
  }

  const cur = track ? trackModel : tab === "office" ? officeModel : model;
  $("updated").textContent = cur ? "Updated " + new Date(cur.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" }) : "";
  $("foot").innerHTML = track ? trackFoot() : tab === "office" ? officeFoot() : `Boarding stop: ${origin ? esc(origin.id + " · " + origin.name + " (" + origin.direction + ")") : "…"}
    · <a id="redetect">re-detect stop</a><br>
    Board and 545 times are <b>LIVE</b> when the bus reports a position, else <b>SCHED</b>. Ride time is scheduled, so "arrive" is an estimate.
    Shuttle times come from the published EG schedule (Mon–Fri), not live data.
    Walk allowance: ${WALK_MINUTES} min (shuttle: ${SHUTTLE_WALK_MINUTES}). Refreshes every ${REFRESH_SECONDS}s.`;
  const r = $("redetect");
  if (r) r.onclick = () => { origin = null; try { localStorage.removeItem("origin:" + ORIGIN_STOP); } catch {} rideSecs.clear(); transferStopId = null; refresh(true); };
}

function renderOffice(cards) {
  if (pick) { renderPick(cards); return; }
  const ride545 = `<button class="track" type="button" data-ride545="1">I'm on the 545</button>`;
  if (!officeModel) { cards.innerHTML = ride545 + (lastError ? "" : `<div class="empty">Loading…</div>`); return; }
  if (!officeModel.options.length) {
    cards.innerHTML = ride545 + `<div class="empty">No 24 / 33 / D Line buses or EG shuttles in the next ${LOOKAHEAD_MINUTES} minutes.</div>`;
    return;
  }
  const now = nowMs();
  cards.innerHTML = ride545 + officeModel.options.map((o, i) => `<section class="card${o.best ? " best" : ""}">
    <div class="top"><span class="route r-${esc(normRoute(o.route))}">${esc(o.route)}</span><span class="head">${esc(o.headsign)}</span>${o.best ? `<span class="badge-best">EARLIEST ARRIVAL</span>` : ""}</div>
    <div class="big">${mins(o.board - now)} <small>· ${fmt(o.board)}${tag(o.boardLive)}</small></div>
    <div class="row"><span class="k">Board at</span><span class="v">${esc(o.boardAt)}</span></div>
    <div class="row"><span class="k">${o.arrLabel}</span><span class="v">${fmt(o.arr)}${o.sched ? tag(false) : `<span class="tag est">EST</span>`}</span></div>
    <div class="row"><span class="k">At your desk</span><span class="v">${fmt(o.office)}<span class="tag est">EST</span></span></div>
    ${trackBtns(o, i)}
  </section>`).join("");
}

function trackFoot() {
  return `Tracking updates every minute (every 30s in the last 5 minutes) and keeps the screen awake while this page is open.
    Next stop and stops-to-go use the bus's live position; if it isn't reporting, they follow the schedule (SCHED). You'll get a buzz and a flashing card at 2 stops or 2 minutes out.`;
}

function officeFoot() {
  return `Starts from where the 545 drops you (5th Ave &amp; Pine). Buses board on 3rd Ave (24/33 at Pine, D Line at Pike) and get off at Elliott &amp; Prospect.<br>
    Walk assumptions: ${WALK_545_TO_3RD_MIN} min to 3rd Ave, ${WALK_545_TO_SHUTTLE_MIN} min to the shuttle, ${BUS_TO_OFFICE_WALK_MIN} min from the bus stop to your desk, ${SHUTTLE_TO_OFFICE_WALK_MIN} min from the shuttle to your desk.
    Bus ride times are scheduled, shuttle times are the published EG schedule (Mon–Fri). Refreshes every ${REFRESH_SECONDS}s.`;
}

function setTab(t) {
  tab = t; backoff = 0; lastError = null;
  clearTimeout(timer);
  render();
  refresh(true);
}
document.querySelectorAll("#tabs button").forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });

$("refreshBtn").onclick = () => { clearTimeout(timer); refresh(true); };
let pressing = false;   // don't swap the DOM out from under a tap in progress
["pointerdown"].forEach((n) => document.addEventListener(n, () => { pressing = true; }));
["pointerup", "pointercancel"].forEach((n) => document.addEventListener(n, () => { pressing = false; }));
setInterval(() => { if (!pressing && (model || officeModel || trackModel)) render(); }, 10000);  // keep "min away" ticking between fetches
document.addEventListener("visibilitychange", () => {
  const cur = track ? trackModel : tab === "office" ? officeModel : model;
  if (document.hidden) clearTimeout(timer);
  else {
    if (track) wake(true);   // the screen lock is released when the page is hidden
    if (!cur || Date.now() - cur.at > (track ? 30 : REFRESH_SECONDS) * 1000) refresh();
    else schedule();
  }
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

(async () => {
  if (new URLSearchParams(location.search).has("mock")) {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "mock.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  }
  tab = seattleClock(Date.now()).sec < 12 * 3600 ? "office" : "home";   // mornings open on "To office"
  try {   // resume a ride in progress (e.g. after a reload) if it started within the last 3 hours
    const t = JSON.parse(localStorage.getItem("track"));
    if (t && t.tripId && Date.now() - t.board < 3 * 3600 * 1000) { track = t; wake(true); } else localStorage.removeItem("track");
  } catch {}
  render();
  refresh();
})();
</script>
